<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精选 — VC Agent</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f7f2ea;
  color: #211c18;
  line-height: 1.65;
}
.page { max-width: 920px; margin: 0 auto; padding: 32px 18px 56px; }
.hero {
  border: 1px solid #eadfce;
  background: linear-gradient(135deg, #fffaf2 0%, #f2e6d4 100%);
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 16px 42px rgba(74, 55, 33, 0.08);
}
.eyebrow {
  color: #9b6b2f; font-size: 12px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
}
h1 { margin: 10px 0 8px; font-size: clamp(28px, 5.5vw, 46px); line-height: 1.08; }
.subtitle { margin: 0; max-width: 680px; color: #675a4c; font-size: 16px; }
.nav-links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; }
.nav-links a {
  font-size: 13px; font-weight: 700; color: #6b4b25;
  text-decoration: none; border-bottom: 1px solid #e2d2bd;
}
.nav-links a:hover { color: #b45309; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
.controls select {
  border: 1px solid #e2d2bd; background: #fffaf4;
  border-radius: 999px; padding: 10px 16px;
  font: inherit; font-size: 14px; color: #211c18; cursor: pointer;
}
.meta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.pill {
  border: 1px solid #e2d2bd; background: rgba(255,255,255,0.6);
  border-radius: 999px; padding: 6px 12px; color: #6b4b25; font-size: 13px;
}
.weights { margin-top: 14px; color: #7b6a58; font-size: 12px; }
.picks { display: grid; gap: 14px; margin: 22px 0 0; padding: 0; list-style: none; }
.pick {
  border: 1px solid #eadfce; background: #fffaf4;
  border-radius: 20px; padding: 20px 22px;
  position: relative;
}
.pick-rank {
  position: absolute; top: 18px; right: 20px;
  font-size: 12px; font-weight: 700; color: #b9a88f;
}
.pick-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.tag { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: #f0e7d8; color: #6b4b25; }
.tag.ai { background: #e0edff; color: #1d4ed8; }
.tag.chip { background: #ede4ff; color: #6b21a8; }
.tag.robot { background: #dcf5e6; color: #15803d; }
.tag.pick-score { background: #171411; color: #fff; }
.pick-date { color: #9b8b75; font-size: 12px; }
.pick-date a { color: #9b8b75; text-decoration: none; border-bottom: 1px solid #e8ddcc; }
.pick-date a:hover { color: #b45309; }
.pick-title {
  display: block; color: #1f2937; font-weight: 700; font-size: 17px;
  text-decoration: none; margin: 4px 40px 6px 0;
}
.pick-title:hover { color: #b45309; }
.pick-meta { color: #9b8b75; font-size: 12px; margin-bottom: 8px; }
.pick-summary { color: #4b4036; font-size: 14px; margin: 0; }
.pick-why {
  color: #8a4b12; background: #fff3df;
  border-radius: 10px; padding: 8px 10px; margin-top: 10px; font-size: 13px;
}
.pick-reason {
  color: #3f4a5c; background: #eef2f9;
  border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 13px;
}
.dims { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dim {
  background: #fff; border: 1px solid #efe5d8; border-radius: 8px;
  padding: 3px 9px; font-size: 12px; color: #6b5a48;
}
.dim b { color: #3d342c; }
.fb-note { margin-top: 8px; color: #15803d; font-size: 12px; }
.fb-note.neg { color: #b91c1c; }
.empty, .error { color: #7a6b5c; padding: 24px 4px; }
.error { color: #991b1b; }
.note {
  margin-top: 22px; padding: 16px 18px;
  border: 1px dashed #e2d2bd; border-radius: 16px;
  color: #7b6a58; font-size: 13px; background: #fffdf9;
}
@media (max-width: 640px) {
  .hero, .pick { padding: 18px; border-radius: 18px; }
  .pick-rank { position: static; display: block; margin-bottom: 6px; }
  .pick-title { margin-right: 0; }
}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="eyebrow">Editor's Picks</div>
    <h1>精选</h1>
    <p class="subtitle">从日报里再筛一层：由模型按影响力、稀缺性、决策参考价值和时效穿透力打分，只有过阈值的才入选。宁缺毋滥，某个周期没有够格的内容就是空的。</p>
    <div class="nav-links">
      <a href="/">最新日报</a>
      <a href="/archive">历史日报</a>
      <a href="/search">内容搜索</a>
      <a href="/radar">AI Radar</a>
    </div>

    <div class="controls">
      <select id="period-select" aria-label="选择周期"><option value="">加载中...</option></select>
    </div>
    <div class="meta-row" id="meta"></div>
    <div class="weights" id="weights"></div>
  </section>

  <ul class="picks" id="picks">
    <li class="empty">正在读取精选...</li>
  </ul>
  <div class="note" id="note" hidden></div>
</main>

<script>
const apiBase = new URLSearchParams(window.location.search).get("api") || "";
const DOMAIN_CLASS = { "AI": "ai", "芯片": "chip", "机器人": "robot" };
const DIM_ORDER = ["impact", "scarcity", "actionability", "durability"];
let periods = [];

function el(id) { return document.getElementById(id); }

function decodeEntities(value) {
  const text = String(value ?? "");
  if (!text.includes("&")) return text;
  const box = document.createElement("textarea");
  box.innerHTML = text;
  return box.value;
}

function escapeHtml(value) {
  return decodeEntities(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function pickHtml(item, rank, weights) {
  const cls = DOMAIN_CLASS[item.domain] || "";
  const dims = item.dims || {};
  const dimHtml = DIM_ORDER
    .filter(k => k in dims)
    .map(k => {
      const label = (weights[k] && weights[k].label) || k;
      return `<span class="dim">${escapeHtml(label)} <b>${escapeHtml(dims[k])}</b></span>`;
    }).join("");

  return `
    <li class="pick">
      <span class="pick-rank">#${rank}</span>
      <div class="pick-top">
        <span class="tag pick-score">${escapeHtml(item.pick_score)} 分</span>
        ${item.domain ? `<span class="tag ${cls}">${escapeHtml(item.domain)}</span>` : ""}
        <span class="pick-date"><a href="/briefing/${escapeHtml(item.date)}">${escapeHtml(item.date)} 日报</a></span>
      </div>
      <a class="pick-title" href="${escapeHtml(item.url || "#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || "未命名条目")}</a>
      <div class="pick-meta">${escapeHtml(item.channel || "未知来源")}${item.quality_score ? ` · 日报评分 ${escapeHtml(item.quality_score)}` : ""}</div>
      ${item.summary ? `<p class="pick-summary">${escapeHtml(item.summary)}</p>` : ""}
      ${item.why_it_matters ? `<div class="pick-why">💡 ${escapeHtml(item.why_it_matters)}</div>` : ""}
      ${item.reason ? `<div class="pick-reason">入选理由：${escapeHtml(item.reason)}</div>` : ""}
      ${dimHtml ? `<div class="dims">${dimHtml}</div>` : ""}
      ${item.feedback_note ? `<div class="fb-note${item.feedback_bonus < 0 ? " neg" : ""}">读者反馈：${escapeHtml(item.feedback_note)}（${item.feedback_bonus > 0 ? "+" : ""}${escapeHtml(item.feedback_bonus)} 分）</div>` : ""}
    </li>
  `;
}

function renderPeriod(period) {
  if (!period) {
    el("picks").innerHTML = `<li class="empty">还没有生成任何精选。</li>`;
    return;
  }

  const weights = period.dimension_weights || {};
  el("meta").innerHTML = `
    <span class="pill">${escapeHtml(period.start)} 至 ${escapeHtml(period.end)}</span>
    <span class="pill">入选 ${escapeHtml(period.pick_count)} 条</span>
    <span class="pill">评分 ${escapeHtml(period.candidates_scored)} 条 / 候选 ${escapeHtml(period.candidates_total)} 条</span>
    <span class="pill">阈值 ${escapeHtml(period.threshold)}</span>
  `;
  el("weights").textContent = "评分维度权重：" + DIM_ORDER
    .filter(k => weights[k])
    .map(k => `${weights[k].label} ${Math.round(weights[k].weight * 100)}%`)
    .join(" · ");

  const items = period.items || [];
  if (!items.length) {
    el("picks").innerHTML = `<li class="empty">这个周期没有内容达到阈值 ${escapeHtml(period.threshold)}。宁缺毋滥，空着也是一种结果。</li>`;
  } else {
    el("picks").innerHTML = items.map((item, i) => pickHtml(item, i + 1, weights)).join("");
  }

  // Make the selection logic legible rather than presenting picks as opaque.
  el("note").hidden = false;
  el("note").textContent =
    `说明：候选来自该周期全部日报条目，按日报评分取前 ${period.candidates_scored} 条送模型打分；` +
    `加权总分达到 ${period.threshold} 才入选，最多保留 12 条。读者反馈作为小幅加减分参与，` +
    `目前反馈样本还很少，权重刻意压低，不会单独决定入选。`;
}

async function init() {
  try {
    const response = await fetch(`${apiBase}/api/picks`, { headers: { "Accept": "application/json" } });
    if (!response.ok) throw new Error(`API ${response.status}`);
    const data = await response.json();
    periods = data.periods || [];
  } catch (error) {
    el("picks").innerHTML = `<li class="error">读取精选失败：${escapeHtml(error.message)}</li>`;
    el("period-select").innerHTML = `<option value="">读取失败</option>`;
    return;
  }

  if (!periods.length) {
    el("period-select").innerHTML = `<option value="">暂无周期</option>`;
    el("picks").innerHTML = `<li class="empty">还没有生成精选。精选每周运行一次，生成半月刊和月刊。</li>`;
    return;
  }

  el("period-select").innerHTML = periods
    .map((p, i) => `<option value="${i}">${escapeHtml(p.label)}（${escapeHtml(p.pick_count)} 条）</option>`)
    .join("");
  el("period-select").addEventListener("change", event => {
    renderPeriod(periods[Number(event.target.value)]);
  });
  renderPeriod(periods[0]);
}

init();
</script>
</body>
</html>
